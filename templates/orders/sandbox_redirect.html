{% extends "base.html" %}
{% block title %}Returning… — {{ store.name }}{% endblock %}
{% block content %}
<section class="wrap page-head">
  <h1 class="display display--lg">Heading back…</h1>
  <form method="post" action="{{ verify_url }}" id="return-form">
    {% csrf_token %}
    <input type="hidden" name="razorpay_order_id" value="{{ razorpay_order_id }}">
    <input type="hidden" name="razorpay_payment_id" value="{{ razorpay_payment_id }}">
    <input type="hidden" name="razorpay_signature" value="{{ razorpay_signature }}">
    <button class="btn btn--primary btn--lg">Continue to your order</button>
  </form>
  <script>document.getElementById("return-form").submit();</script>
</section>
{% endblock %}
